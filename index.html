<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engagement Invitation</title>
  <style>
    .container {
      position: relative;
      display: inline-block;
      width: 100%;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
    }
    /* Invisible clickable overlay link that works in PDFs */
    .map-link {
      position: absolute;
      /* Adjust these percentages to fit over the venue / location area */
      bottom: 2%;
      right: 2%;
      width: 45%;
      height: 20%;
      background: rgba(255, 0, 0, 0); /* Invisible */
      display: block;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="IMG_20260819_142057.jpg.jpeg" alt="Engagement Invite">
    
    <!-- Real HTML link anchor -->
    <a class="map-link" href="https://maps.app.goo.gl/672HR65Y3cj6rrud9?g_st=ac" target="_blank" title="Open Google Maps"></a>
  </div>

</body>
</html>
